# .github/workflows/build-macos.yml — R9: Build macOS via GitHub Actions
#
# Trigger:
# - push di un tag client/vXXXX.X-stable  → build automatico + release asset
# - workflow_dispatch                     → run manuale dalla UI Actions
#
# Output: dist/TrackLab.dmg disponibile come:
# - Artifact del run (90 giorni di retention) → sempre
# - Asset della GitHub Release             → solo se trigger e' tag
#
# Runner: macos-14 (Apple Silicon arm64). Per Intel x86_64 servirebbe
# un secondo job con `runs-on: macos-13`. Per ora arm64-only (la
# stragrande maggioranza dei Mac post-2020 e' Apple Silicon).
#
# Costo: macos-* runner gratis su public repo, ma usa 10 min/min sul
# budget (2000 min/mese gratis Linux equivalenti -> ~200 min macOS).
# Build tipica ~5-8 min -> ~25-40 build/mese disponibili. Sufficiente
# per pilot.
#
# Firma + notarization Apple Developer: NON applicate (Pedro v1095.0).
# Quando si avra' un Apple Developer account ($99/anno, R19) si
# aggiungeranno gli step `xcrun notarytool` e `codesign` qui.

name: build-macos

on:
  push:
    tags:
      - 'client/v*-stable'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override versione (opzionale, default: leggi version.py)"
        required: false
        type: string

jobs:
  build-macos-arm64:
    name: Build TrackLab.dmg (arm64)
    runs-on: macos-14   # Apple Silicon (M1) runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Serve git history per leggere la versione e per i tag info
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: client/requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          sw_vers
          uname -m
          echo "Tag: ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"

      - name: Install Python deps
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Read app version
        id: version
        working-directory: client
        run: |
          # Estrai APP_VERSION da version.py per nominare il .dmg
          APP_VER=$(python -c "
          import re, pathlib
          src = pathlib.Path('version.py').read_text()
          m = re.search(r'APP_VERSION\s*=\s*[\"\\']v?([^\"\\']+)', src)
          print(m.group(1) if m else 'unknown')
          ")
          if [ -n "${{ inputs.version_override }}" ]; then
            APP_VER="${{ inputs.version_override }}"
          fi
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "App version: ${APP_VER}"

      - name: Build .app bundle (PyInstaller)
        working-directory: client
        run: |
          # Lo spec genera l'icona .icns automaticamente da PNG
          pyinstaller tracklab_macos.spec --clean --noconfirm
          ls -la dist/
          # Verifica che TrackLab.app sia stato creato
          test -d dist/TrackLab.app

      - name: Smoke test bundle
        working-directory: client
        run: |
          # Verifica struttura .app
          test -f dist/TrackLab.app/Contents/Info.plist
          test -d dist/TrackLab.app/Contents/MacOS
          test -f dist/TrackLab.app/Contents/MacOS/TrackLab
          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            dist/TrackLab.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            dist/TrackLab.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" \
            dist/TrackLab.app/Contents/Info.plist
          echo "=== Size ==="
          du -sh dist/TrackLab.app

      - name: Create .dmg
        working-directory: client
        run: |
          DMG_NAME="TrackLab-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          # Layout: cartella temporanea con TrackLab.app + symlink ad
          # /Applications così l'utente puo' drag-and-drop dentro al dmg
          STAGE="dist/dmg-stage"
          mkdir -p "${STAGE}"
          cp -R dist/TrackLab.app "${STAGE}/"
          ln -s /Applications "${STAGE}/Applications"

          # hdiutil e' built-in macOS, no dipendenze esterne
          hdiutil create \
            -volname "TrackLab" \
            -srcfolder "${STAGE}" \
            -ov \
            -format UDZO \
            "dist/${DMG_NAME}"

          # Cleanup stage
          rm -rf "${STAGE}"

          echo "DMG_FILE=client/dist/${DMG_NAME}" >> $GITHUB_ENV
          ls -lh "dist/${DMG_NAME}"

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: TrackLab-macos-arm64-${{ steps.version.outputs.version }}
          path: ${{ env.DMG_FILE }}
          retention-days: 90
          if-no-files-found: error

      - name: Attach DMG to GitHub Release (solo se trigger e' tag)
        if: startsWith(github.ref, 'refs/tags/client/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE }}
          # Se la release non esiste, action-gh-release la crea con
          # release notes vuoti. Pedro le compila a mano via UI come
          # da convenzione (vedi docs/CLAUDE.md).
          generate_release_notes: false
          # tag_name è auto-derivato da github.ref
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
