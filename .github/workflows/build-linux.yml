# .github/workflows/build-linux.yml — R9.b: Build Linux via GitHub Actions
#
# Output: TrackLab-vXXXX.X-linux-x86_64.AppImage
# - Single-file portable, l'utente fa `chmod +x` + doppio click
# - Funziona su Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch, etc.
#   (richiede glibc >= 2.35, presente in tutte le distro del 2022+)
#
# Trigger: stesso pattern di build-macos.yml (tag client/v*-stable +
# workflow_dispatch).
#
# Costo: runner Linux ha moltiplicatore 1x (vs 10x macOS), quindi
# 2000 min/mese gratis su public repo = ~250 build/mese. Generoso.
#
# Architettura: solo x86_64. Per arm64 servirebbe un secondo job con
# `runs-on: ubuntu-22.04-arm` o cross-compile (complicazione fuori
# scope per ora — i DJ su Linux usano per lo piu' laptop Intel/AMD).

name: build-linux

on:
  push:
    tags:
      - 'client/v*-stable'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override versione (opzionale, default: leggi version.py)"
        required: false
        type: string

permissions:
  contents: write   # create/update release + upload asset (vedi macos hotfix v1095.2)

jobs:
  build-linux-x86_64:
    name: Build TrackLab.AppImage (x86_64)
    runs-on: ubuntu-22.04   # LTS stabile, glibc 2.35
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: client/requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version
          uname -a
          cat /etc/os-release | head -5
          echo "Tag: ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"

      - name: Install system deps (tk + AppImage tools)
        run: |
          sudo apt-get update -qq
          # Tk per customtkinter, libfuse2 e' richiesto da AppImage runtime
          # (le distro moderne non lo hanno di default in alcuni casi)
          sudo apt-get install -y -qq \
            python3-tk \
            tk-dev \
            libfuse2 \
            wget \
            file
          # appimagetool: standalone, lo scarichiamo
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Install Python deps
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Read app version
        id: version
        working-directory: client
        run: |
          APP_VER=$(python -c "
          import re, pathlib
          src = pathlib.Path('version.py').read_text()
          m = re.search(r'APP_VERSION\s*=\s*[\"\\']v?([^\"\\']+)', src)
          print(m.group(1) if m else 'unknown')
          ")
          if [ -n "${{ inputs.version_override }}" ]; then
            APP_VER="${{ inputs.version_override }}"
          fi
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "App version: ${APP_VER}"

      - name: Build binary (PyInstaller)
        working-directory: client
        run: |
          pyinstaller tracklab_linux.spec --clean --noconfirm
          ls -la dist/
          # tracklab_linux.spec produce un singolo binario `dist/TrackLab`
          # in modalita' onefile (vedi commento dello spec)
          test -f dist/TrackLab
          file dist/TrackLab

      - name: Build AppImage
        working-directory: client
        run: |
          APP_VER="${{ steps.version.outputs.version }}"
          APPIMG_NAME="TrackLab-${APP_VER}-linux-x86_64.AppImage"

          # Costruisci la struttura AppDir richiesta da appimagetool
          APPDIR="dist/TrackLab.AppDir"
          mkdir -p "${APPDIR}/usr/bin"

          # Copia il binario PyInstaller
          cp dist/TrackLab "${APPDIR}/usr/bin/TrackLab"
          chmod +x "${APPDIR}/usr/bin/TrackLab"

          # .desktop file (richiesto dall'AppImage)
          # Lo copio dal repo + modifico Exec= per AppImage convention
          cp tracklab.desktop "${APPDIR}/tracklab.desktop"

          # Icona PNG (richiesta nella root della AppDir)
          # Usa l'icona 256 del progetto, la rinomino a 'tracklab.png'
          # (deve matchare il valore di Icon= nel .desktop)
          if [ -f icons/app/app_icon_256.png ]; then
            cp icons/app/app_icon_256.png "${APPDIR}/tracklab.png"
          else
            echo "WARNING: icona PNG non trovata, AppImage senza icona custom"
          fi

          # AppRun: entry point dell'AppImage. Lancia il binario.
          cat > "${APPDIR}/AppRun" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/TrackLab" "$@"
          EOF
          chmod +x "${APPDIR}/AppRun"

          # Genera l'AppImage
          # ARCH=x86_64 e' richiesto da appimagetool sui runner GH Actions
          ARCH=x86_64 /tmp/appimagetool "${APPDIR}" "dist/${APPIMG_NAME}"

          # Cleanup AppDir
          rm -rf "${APPDIR}"

          # Verifica
          ls -lh "dist/${APPIMG_NAME}"
          file "dist/${APPIMG_NAME}"

          echo "APPIMG_FILE=client/dist/${APPIMG_NAME}" >> $GITHUB_ENV

      - name: Smoke test AppImage
        # Non possiamo lanciare la GUI in CI (no display), ma verifichiamo
        # che il file sia eseguibile e ben formato.
        working-directory: client
        run: |
          chmod +x "${APPIMG_FILE#client/}"
          file "${APPIMG_FILE#client/}"

      - name: Upload artifact (sempre)
        uses: actions/upload-artifact@v4
        with:
          name: TrackLab-linux-x86_64-${{ steps.version.outputs.version }}
          path: ${{ env.APPIMG_FILE }}
          retention-days: 90
          if-no-files-found: error

      - name: Attach AppImage to GitHub Release (solo se trigger e' tag)
        if: startsWith(github.ref, 'refs/tags/client/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMG_FILE }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
